<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ff8738">
  <meta name="description" content="Uma coleção de chatbots para conversar, explorar e imaginar.">
  <title>Chatbots — conversa ao ritmo certo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --ink: #111;
      --yellow: #ffe34f;
      --orange: #ff8738;
      --red: #f04e5e;
      --turquoise: #35d4c7;
      --display: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
      --body: "Nunito", "Avenir Next", Avenir, system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      color: var(--ink);
      background: linear-gradient(160deg, var(--yellow) 0%, var(--orange) 44%, var(--red) 100%);
      font-family: var(--body);
      line-height: 1.5;
    }

    .page {
      position: relative;
      z-index: 1;
      width: min(100% - 40px, 960px);
      min-height: 100vh;
      margin-inline: auto;
      padding: clamp(56px, 12vh, 120px) 0 220px;
    }

    .eyebrow {
      margin: 0 0 8px;
      font-size: .82rem;
      font-weight: 900;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    h1, h2, p { margin-top: 0; }

    h1 {
      max-width: 720px;
      margin-bottom: 12px;
      font: 700 clamp(3rem, 9vw, 6.5rem)/.98 var(--display);
      letter-spacing: -.04em;
    }

    .intro {
      max-width: 560px;
      margin-bottom: 42px;
      font-size: clamp(1.05rem, 2.5vw, 1.25rem);
      font-weight: 700;
    }

    .projects {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 270px), 1fr));
      gap: 18px;
      max-width: 620px;
    }

    .project-card {
      display: flex;
      min-height: 230px;
      flex-direction: column;
      align-items: flex-start;
      padding: 26px;
      border: 3px solid var(--ink);
      border-radius: 28px;
      background: rgb(255 248 231 / 92%);
      box-shadow: 7px 7px 0 var(--ink);
    }

    .project-card h2 {
      margin-bottom: 8px;
      font: 700 1.8rem/1.1 var(--display);
    }

    .project-card p { margin-bottom: 20px; }

    .project-link {
      display: inline-flex;
      min-height: 46px;
      align-items: center;
      margin-top: auto;
      padding: 9px 18px;
      border: 2px solid var(--ink);
      border-radius: 999px;
      background: var(--turquoise);
      color: var(--ink);
      font-weight: 900;
      text-decoration: none;
      transition: transform .15s ease, box-shadow .15s ease;
    }

    .project-link:hover {
      transform: translate(-2px, -2px);
      box-shadow: 3px 3px 0 var(--ink);
    }

    .project-link:focus-visible {
      outline: 3px solid var(--ink);
      outline-offset: 4px;
    }

    .landscape {
      position: fixed;
      z-index: 0;
      right: 0;
      bottom: 0;
      left: 0;
      width: 100%;
      height: min(34vh, 300px);
      pointer-events: none;
    }

    .sun {
      position: fixed;
      z-index: 0;
      right: 10vw;
      bottom: 12vh;
      width: clamp(90px, 15vw, 170px);
      aspect-ratio: 1;
      border-radius: 50%;
      background: var(--yellow);
    }

    .hills-back { fill: var(--ink); opacity: .5; }
    .hills-front, .grass { fill: var(--ink); }

    @media (max-width: 480px) {
      .page { width: min(100% - 32px, 960px); }
      .project-card { min-height: 210px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="page">
    <p class="eyebrow">Pequenos mundos, boas conversas</p>
    <h1>Chatbots</h1>
    <p class="intro">Projetos para conversar, imaginar e descobrir. Escolhe por onde começar.</p>

    <section class="projects" aria-label="Lista de chatbots">
      <article class="project-card">
        <h2>Patati Patata</h2>
        <p>Dois amigos, conversa com imaginação, humor e uma pitada de juízo — ao ritmo de texto e percussão.</p>
        <a class="project-link" href="patati-patata/">Conhecer o projeto <span aria-hidden="true">&nbsp;→</span></a>
      </article>
    </section>
  </main>

  <div class="sun" aria-hidden="true"></div>
  <svg class="landscape" viewBox="0 0 1440 300" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <path class="hills-back" d="M0 205 Q140 125 285 190 T570 175 T855 195 T1140 155 T1440 180 V300 H0Z"/>
    <path class="hills-front" d="M0 245 Q180 165 360 232 T720 218 T1080 230 T1440 190 V300 H0Z"/>
    <g class="grass">
      <path d="M0 275 Q14 250 10 227 Q30 250 27 276 Q42 250 57 246 Q43 267 44 283 L75 300 H0Z"/>
      <path d="M1365 270 Q1385 241 1380 220 Q1404 248 1398 276 Q1420 251 1440 250 V300 H1350Z"/>
      <path d="M210 296 Q223 275 219 258 Q238 280 235 299Z"/>
      <path d="M1225 298 Q1240 272 1235 251 Q1256 277 1251 300Z"/>
    </g>
  </svg>
</body>
</html>
